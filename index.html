<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>영상 아카이브</title>
<style>
  :root{
    --bg:#fffaf1; --panel:#fbeed8; --line:#f0dcbc;
    --text:#4b3521; --muted:#a58d72; --red:#f08a2c; --gold:#e08a00;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
  .logo{padding:36px 0 20px;font-size:28px;font-weight:800;letter-spacing:.02em}
  .logo span{color:var(--red)}
  [hidden]{display:none!important}
  #status{color:var(--muted);font-size:14px;padding:12px 0;white-space:pre-line}

  .pinbar{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:6px;padding:0 0 18px}
  .pinbar::-webkit-scrollbar{display:none}
  .pin{grid-column:span 5;padding:6px 2px;border-radius:999px;border:1.5px solid var(--line);text-align:center;
    background:var(--panel);color:var(--text);font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:clip}

  .sec{margin-bottom:28px}
  .sec-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
  .sec-head h2{margin:0;font-size:18px}
  .more{color:var(--gold);font-size:14px;font-weight:600}
  .slider-box{position:relative}
  .slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .slider::-webkit-scrollbar{display:none}
  .slide{flex:0 0 84%;max-width:420px;scroll-snap-align:start;position:relative}
  .arrow{position:absolute;top:35%;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.92);color:#111;box-shadow:0 1px 6px rgba(0,0,0,.4);font-size:16px;display:none}
  .arrow.l{left:4px}.arrow.r{right:4px}
  @media(hover:hover){.arrow{display:block}}

  .back{color:var(--muted);font-size:14px;margin-bottom:8px}
  .tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:12px 2px;color:var(--muted);font-size:16px;white-space:nowrap;
    border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--text);font-weight:700;border-color:var(--red)}
  .search{width:100%;margin:16px 0 10px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;outline:none}
  .search:focus{border-color:#f2b36b}

  .memf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
  .mchip{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
    background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .mchip.on{background:var(--c);color:#3a2a1a;border-color:transparent}

  .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
    color:var(--muted);font-size:14px}
  .sort{display:flex;background:var(--panel);border-radius:999px;padding:3px}
  .sort button{padding:4px 10px;border-radius:999px;color:var(--muted);font-size:12px}
  .sort button.on{background:#f7b955;color:#4b3521;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
  .album-head{grid-column:1/-1;font-weight:700;font-size:15px;margin:6px 0 -4px;color:var(--gold)}

  .card{display:block;color:inherit;text-decoration:none;min-width:0}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  /* X / Instagram: 원본 임베드 크기로 표시 (잘라내지 않음) */
  .embedfree{width:100%;overflow:visible}
  .embedfree blockquote,.embedfree iframe{width:100% !important;max-width:550px !important;margin:0 !important}
  .embedfree .twitter-tweet-rendered{max-width:550px !important}
  .embedfree .instagram-media-rendered{max-width:540px !important}
  /* 목록에서 소셜 게시물은 한 줄에 하나 */
  .grid.social-list{grid-template-columns:1fr}
  .grid.social-list .card{width:100%;max-width:550px}
  /* 메인 MEMBERS X 슬라이드는 임베드 원본 폭을 우선 */
  .slide.social-slide{flex:0 0 min(550px,100%);max-width:550px}
  /* 인스타그램: 다른 영상 카드와 같은 16:9 칸 안에 비율 유지하며 맞춰 넣음 */
  .thumb.embedbox{background:none;overflow:hidden}
  .thumb.igthumb{aspect-ratio:4/5} /* 인스타그램 카드는 4:5 */
  .thumb.twthumb{aspect-ratio:auto;border-radius:14px} /* X(트위터) 카드는 아래쪽(좋아요/답글)을 잘라낸 높이 */
  .twthumb .igwrap{position:relative;inset:auto;width:100%;min-height:120px}
  .thumb.ph{background:linear-gradient(135deg,#f8ead3,#f2dcb9);display:flex;align-items:center;justify-content:center}
  .phtxt{font-weight:800;font-size:18px;letter-spacing:.5px;opacity:.85}
  .igwrap{position:absolute;inset:0;overflow:hidden}
  .iginner{position:absolute;top:0;left:0;transform-origin:0 0;width:326px;visibility:hidden}
  .iginner.ready{visibility:visible}
  .embedfree .igwrap{position:relative;inset:auto;width:100%}
  .igwrap .twitter-tweet,.igwrap .twitter-tweet-rendered{margin:0!important;max-width:none!important;width:100%!important}
  .igwrap .instagram-media,.igwrap iframe{min-width:0!important;max-width:none!important;width:100%!important;margin:0!important}
  .igwrap blockquote.instagram-media:not(.instagram-media-rendered){opacity:0;background:none!important;border:0!important;box-shadow:none!important}
  /* 귤 도장: 눌러서 영상을 목록 맨 위에 고정 */
  :root{--tg:#ff8a1f;--tg-d:#e06f08}
  .pinbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:2;width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
    background:#fff;border:1.2px solid #d9dbe4;color:#a3a8b8;
    transition:background .15s,border-color .15s,color .15s}
  .pinbtn svg{width:16px;height:16px;display:block}
  .pinbtn.on{background:var(--tg);border-color:transparent;color:#fff;box-shadow:0 1px 5px rgba(224,111,8,.5);animation:pinpop .32s ease}
  @keyframes pinpop{0%{transform:translateY(-50%) scale(.6) rotate(-20deg)}60%{transform:translateY(-50%) scale(1.18) rotate(6deg)}100%{transform:translateY(-50%) scale(1) rotate(0)}}
  .card .info.pinrow{position:relative;padding-right:32px}
  /* PHOTO: 영상 카드와 같은 모양의 카드 → 누르면 사진 모아보기 */
  .thumb.phthumb{aspect-ratio:4/5}   /* 카드 표지 비율 (1/1 로 바꾸면 정사각형) */
  .card.photo-card{cursor:pointer}
  .pv{position:fixed;inset:0;z-index:200;background:#fbf6ee;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pv-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(251,246,238,.96);
    border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
  .pv-x{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--panel);font-size:22px;line-height:1;color:var(--text)}
  .pv-h{min-width:0;flex:1}
  .pv-t{font-size:15px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-m{font-size:12px;color:var(--muted);margin-top:2px}
  .pv-m a{color:var(--gold);margin-left:6px}
  .pv-body{max-width:960px;margin:0 auto;padding:14px 12px 60px;display:flex;flex-direction:column;gap:10px}
  .pv-body.pv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
  .pv-body.pv2 .pv-end{grid-column:1/-1}
  .pv-body img{width:100%;height:auto;display:block;border-radius:10px;background:#efe3cf}
  .pv-end{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}
  .card.pinned .thumb{outline:3px solid #ffc98a;outline-offset:-3px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#283048;color:#fff;font-size:13.5px;
    padding:11px 18px;border-radius:14px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;
    font-size:12px;padding:2px 7px;border-radius:6px}
  .title{margin:10px 0 6px;font-size:14.5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .info{color:var(--muted);font-size:13px;line-height:1.5}
  .plat{position:absolute;right:6px;top:6px;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;line-height:1.3}
  .mem{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .mem span{color:#3a2a1a;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
</style>

<body>
<div class="wrap">
  <div class="logo" id="logo"></div>
  <div id="status">불러오는 중...</div>

  <div class="pinbar" id="pinbar" hidden></div>
  <section id="home" hidden></section>

  <section id="list" hidden>
    <button class="back" id="back">← 홈으로</button>
    <div class="tabs" id="tabs"></div>
    <input class="search" id="search" placeholder="영상 제목으로 검색" />
    <div class="memf" id="memf"></div>
    <div class="meta">
      <span id="count"></span>
      <div class="sort">
        <button data-s="date" class="on">최신순</button>
        <button data-s="views">인기순</button>
        <button data-s="oldest">날짜순</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

  const isPinned = (v) => pinnedSet.has(pinKey(v));

  const TANGERINE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="7.6"/><path d="M12 6.4c.2-1.3.9-2.1 1.8-2.5" /><path d="M12.2 6.2c1.2-1.9 3.4-2.4 5-1.7-.6 1.9-2.6 3.1-5 1.7z" fill="currentColor" stroke="none"/><path d="M8.6 12.2c.5-1 1.2-1.6 2.1-1.9" opacity=".7"/></svg>';
  let toastTimer;
  function showToast(msg) {
    let t = document.getElementById("toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }
  function card(v, free) {
    const embedHtml = v.embed === "twitter"
      ? (free
        ? `<blockquote class="twitter-tweet" data-dnt="true"><a href="${v.url}"></a></blockquote>`
        : `<div class="igwrap" data-lazy="twitter" data-url="${v.url}"><div class="iginner"></div></div>`)
      : v.embed === "instagram"
      ? `<div class="igwrap" data-lazy="instagram" data-url="${v.url}"><div class="iginner"></div></div>`
      : null;

    // 소셜 임베드는 free 모드에서 원본 비율/높이를 유지하고 잘라내지 않습니다.
    if (embedHtml && free) {
      return `<a class="card" href="${v.url}" target="_blank" rel="noopener">
        <div class="embedfree">${embedHtml}</div>
        <div class="title">${esc(v.title)}</div>
        <div class="info">${fmtDate(v.date)}</div>
        ${shownMem(v).length ? `<div class="mem">${shownMem(v).map((m) => `<span style="background:${MEMBER_COLORS[m] || "#ddd"}">${m}</span>`).join("")}</div>` : ""}
      </a>`;
    }

    const isLive = (v.cats || []).some((c) => c === "LIVE" || c === "L(IVE)");
    const isPhoto = !!(v.photos && v.photos.length);
    return `<a class="card${isPinned(v) ? " pinned" : ""}${isPhoto ? " photo-card" : ""}" href="${v.url || (isPhoto ? "#" : "https://youtu.be/" + v.id)}" ${isPhoto ? `data-pk="${esc(pinKey(v))}"` : 'target="_blank" rel="noopener"'}>
      <div class="thumb${isPhoto ? " phthumb" : ""}${embedHtml ? " embedbox" + (v.ratio === "16:9" ? "" : v.embed === "twitter" ? " twthumb" : " igthumb") : (!v.thumb && !isLive ? " ph" : "")}">
        ${embedHtml || (v.thumb ? `<img src="${v.thumb}" alt="" loading="lazy" decoding="async" />` : isLive ? "" : `<span class="phtxt" style="color:${PLATFORM_COLORS[v.platform] || "#b9945f"}">${v.platform || ""}</span>`)}
        ${!embedHtml && v.platform && (v.thumb || isLive) ? `<span class="plat" style="background:${PLATFORM_COLORS[v.platform] || "#888"}">${v.platform}</span>` : ""}
        ${!embedHtml && v.lyricsType ? `<span class="plat" style="background:${v.lyricsType === "단독" ? "var(--red)" : "#c9c2b8"}">${v.lyricsType}</span>` : ""}
        ${!embedHtml && v.sec ? `<span class="dur">${fmtDur(v.sec)}</span>` : ""}
        ${isPhoto && v.photos ? `<span class="plat" style="background:rgba(40,30,20,.72)">📷 ${v.photos.length}</span>` : ""}
      </div>
      <div class="title">${esc(v.title)}</div>
      <div class="info pinrow">${v.views !== null && !hideViews(v) ? fmtViews(v.views) + "<br>" : ""}${fmtDate(v.date)}<span class="pinbtn${isPinned(v) ? " on" : ""}" role="button" aria-label="상단에 고정" title="상단에 고정" data-pin="${esc(pinKey(v))}">${TANGERINE_SVG}</span></div>
      ${shownMem(v).length ? `<div class="mem">${shownMem(v).map((m) => `<span style="background:${MEMBER_COLORS[m] || "#ddd"}">${m}</span>`).join("")}</div>` : ""}
    </a>`;
  }

  // 인스타그램 임베드 크기 배율 (1 = 16:9 칸에 딱 맞춤, 0.8 = 80%). 웹/모바일 따로 조절하세요.
  const IG_FIT = { web: 1, mobile: 1 };
  // 인스타그램 4:5 카드: 임베드를 가로로 꽉 채운 뒤 위쪽 프로필 줄(header)만큼 잘라내서 영상 화면 위주로 보이게 함.
  // header = 임베드 상단 프로필 줄 높이(px, 326px 폭 기준) / shiftY = 영상 구도를 아래로 더 내릴 값(px)
  const IG_CROP = { header: 60, shiftY: 0 };
  // X(트위터) 카드: 계정 줄이 보이도록 위쪽은 그대로 두고, 아래 좋아요·답글하기 줄부터 잘라냄
  const TW_CROP = { top: 0, bottom: 0 }; // bottom: 아래쪽 좋아요·답글하기 줄을 잘라낼 높이(px)
  function fitIg() {
    const mobile = window.matchMedia("(max-width:700px)").matches;
    const fit = mobile ? IG_FIT.mobile : IG_FIT.web;
    document.querySelectorAll(".igwrap").forEach((w) => {
      const i = w.firstElementChild;
      const free = !!w.closest(".embedfree");
      const cw = w.clientWidth;
      if (!cw) return;
      if (!i._ro) {
        i._ro = true;
        if (window.ResizeObserver) { const ro = new ResizeObserver(fitIg); ro.observe(i); ro.observe(w); }
        if (window.MutationObserver) {
          new MutationObserver((recs) => { if (recs.some((r) => !(r.type === "attributes" && r.target === i))) fitIg(); })
            .observe(i, { childList: true, subtree: true, attributes: true, attributeFilter: ["height", "style", "class"] });
        }
      }
      const base = free ? Math.max(326, Math.min(cw, 540)) : 326;
      i.style.width = base + "px";
      const ih = i.offsetHeight;
      if (!ih) return;
      const bw = Math.max(base, i.scrollWidth);
      if (free) {
        const sc = Math.min(1, cw / bw);
        i.style.transform = `scale(${sc})`;
        i.style.left = Math.max(0, (cw - bw * sc) / 2) + "px";
        w.style.height = (ih * sc) + "px";
      } else if (w.closest(".twthumb")) {
        const sc = cw / bw;
        i.style.transform = `scale(${sc})`;
        i.style.left = "0px";
        i.style.top = -TW_CROP.top * sc + "px";
        w.style.height = Math.max(120, (ih - TW_CROP.top - TW_CROP.bottom) * sc) + "px";
      } else if (w.closest(".igthumb")) {
        const sc = cw / bw;
        i.style.transform = `scale(${sc})`;
        i.style.left = "0px";
        i.style.top = -(IG_CROP.header + IG_CROP.shiftY) * sc + "px";
      } else {
        const ch = w.clientHeight;
        const sc = Math.min(cw / bw, ch / ih) * fit;
        i.style.transform = `scale(${sc})`;
        i.style.left = Math.max(0, (cw - bw * sc) / 2) + "px";
        i.style.top = Math.max(0, (ch - ih * sc) / 2) + "px";
      }
      i.classList.add("ready");
    });
  }
  window.addEventListener("resize", fitIg);
  // 화면에 가까워진 임베드만 그때그때 불러와서 로딩을 빠르게 함
  // 임베드는 한꺼번에 불러오면 느려지므로 IG_MAX개씩 순서대로 불러옴 (하나가 그려지면 다음 차례)
  const IG_MAX = 3, igQueue = [];
  let igActive = 0;
  function loadEmbed(w) { igQueue.push(w); pumpEmbeds(); }
  function pumpEmbeds() {
    while (igActive < IG_MAX && igQueue.length) {
      const w = igQueue.shift();
      igActive++;
      let done = false;
      const fin = () => { if (done) return; done = true; igActive--; pumpEmbeds(); };
      startEmbed(w);
      const i = w.firstElementChild;
      const mo = new MutationObserver(() => { if (i.querySelector("iframe")) { mo.disconnect(); setTimeout(fin, 150); } });
      mo.observe(i, { childList: true, subtree: true });
      setTimeout(() => { mo.disconnect(); fin(); }, 3000);
    }
  }
  function startEmbed(w) {
    const kind = w.dataset.lazy, url = w.dataset.url;
    w.dataset.kind = kind; // 로딩 후에도 인스타/트위터 구분 유지
    delete w.dataset.lazy;
    const i = w.firstElementChild;
    i.innerHTML = kind === "twitter"
      ? `<blockquote class="twitter-tweet" data-dnt="true" data-width="326"><a href="${url}"></a></blockquote>`
      : `<blockquote class="instagram-media" data-instgrm-permalink="${url}" style="margin:0;width:100%"></blockquote>`;
    if (kind === "twitter") { if (window.twttr && window.twttr.widgets) window.twttr.widgets.load(i); }
    else if (window.instgrm) window.instgrm.Embeds.process();
  }
  const igIO = window.IntersectionObserver
    ? new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { igIO.unobserve(e.target); loadEmbed(e.target); } }), { rootMargin: "250px 150px" })
    : null;
  function processEmbeds() {
    document.querySelectorAll(".igwrap[data-lazy]").forEach((w) => { if (igIO) { if (!w._obs) { w._obs = 1; igIO.observe(w); } } else loadEmbed(w); });
    if (window.twttr && window.twttr.widgets) window.twttr.widgets.load();
    if (window.instgrm) window.instgrm.Embeds.process();
    fitIg();
    requestAnimationFrame(fitIg);
    [600, 1500, 3000, 6000].forEach((t) => setTimeout(fitIg, t));
  }

  function renderPinBar() {
    const pins = HOME_SECTIONS.map((s, si) => (s.noPin ? "" : `<button class="pin" data-jump="${si}">${s.title}</button>`)).filter(Boolean).reverse();
    const sch = HOME_SECTIONS.findIndex((s) => s.title === "SCHEDULES");
    if (sch >= 0) pins.unshift(...pins.splice(pins.findIndex((p) => p.includes(`data-jump="${sch}"`)), 1)); // SCHEDULES를 맨 앞으로
    $("pinbar").innerHTML = pins.join("");
  }

  function renderHome() {
    $("home").innerHTML = HOME_SECTIONS.map((s, si) => {
      const items = videos.filter((v) => s.cats.some((c) => v.cats.includes(c)) && (!s.noEmbedOnHome || !v.embed) && !(s.excludeMembers || []).some((m) => v.members.includes(m)))
        .sort((a, b) => s.sort === "date" ? new Date(b.date) - new Date(a.date) : (b.views || 0) - (a.views || 0));
      const top = pinnedFirst(items).slice(0, 5);
      if (!items.length) return "";
      const slides = top.map((v) => `<div class="slide${s.freeEmbed && v.embed ? " social-slide" : ""}">${card(v, s.freeEmbed)}</div>`).join("");
      return `<div class="sec" id="sec-${si}">
        <div class="sec-head"><h2>${s.title}</h2><button class="more" data-sec="${si}">더보기 →</button></div>
        <div class="slider-box"><div class="slider">${slides}</div>
          <button class="arrow l" data-d="-1">◀</button><button class="arrow r" data-d="1">▶</button></div>
      </div>`;
    }).join("") + '<div style="text-align:center"><button class="more" data-all>전체 영상 보기 →</button></div>';
    processEmbeds();
  }

  function renderMemberFilter() {
    $("memf").innerHTML = MEMBER_LIST.map((m) =>
      `<button class="mchip ${memberFilter.includes(m) ? "on" : ""}" data-m="${m}" style="--c:${MEMBER_COLORS[m]}">${m}</button>`).join("");
  }

  function renderAlbumSections(items) {
    const groups = {};
    items.forEach((v) => { if (v.album) { groups[v.album] = groups[v.album] || []; groups[v.album].push(v); } });
    return Object.keys(groups).map((name) => {
      const slides = groups[name].slice(0, 10).map((v) => `<div class="slide">${card(v)}</div>`).join("");
      return `<div class="sec">
        <div class="sec-head"><h2>📁 ${esc(name)}</h2><button class="more" data-album="${esc(name)}">더보기 →</button></div>
        <div class="slider-box"><div class="slider">${slides}</div>
          <button class="arrow l" data-d="-1">◀</button><button class="arrow r" data-d="1">▶</button></div>
      </div>`;
    }).join("");
  }

  // 폴더(album) 안에서 맨 앞에 놓을 게시물 (링크 속 코드, 아래 순서대로 맨 위에 표시 / 고정 아님)
  const PIN_FIRST = ["DYBsKjFzg7Z", "DGVGTohhvCk", "DB8aoS4pybA", "DAYc_lfSvc-", "DeEy3CDiOa5", "DeE82qKuV_g", "DeGf-n2oUS5"];
  function pinFirst(items) {
    const rank = (v) => PIN_FIRST.findIndex((c) => (v.url || "").includes(c));
    const slots = {};
    items.forEach((v, i) => { const k = v.album || ""; (slots[k] = slots[k] || []).push(i); });
    const out = items.slice();
    Object.values(slots).forEach((idx) => {
      const grp = idx.map((i) => items[i]);
      const pinned = grp.filter((v) => rank(v) >= 0).sort((a, b) => rank(a) - rank(b));
      const rest = grp.filter((v) => rank(v) < 0);
      [...pinned, ...rest].forEach((v, j) => { out[idx[j]] = v; });
    });
    return out;
  }

  function renderList() {
    const name = tabList()[tab];
    const label = TAB_LABELS[name] || name;
    const hideMem = !!(scope && scope.hideMembers) || name === "SOLO" || name === "ASMR" || FANCAM_TABS.includes(name);
    $("memf").hidden = hideMem;
    if (hideMem) memberFilter = []; else renderMemberFilter();
    const noViews = !!(scope && scope.hideViews) || SCHEDULE_CATS.includes(name) || name === "PHOTO";
    const viewsBtn = document.querySelector('.sort [data-s="views"]');
    document.querySelector(".sort").hidden = false;
    if (viewsBtn) viewsBtn.hidden = noViews; // 조회수가 없는 탭(SCHEDULES 등)은 인기순만 숨기고 최신순/날짜순은 유지
    if (noViews && sort === "views") {
      sort = "date";
      document.querySelectorAll(".sort button").forEach((b) => b.classList.toggle("on", b.dataset.s === "date"));
    }
    let items = videos.filter((v) =>
      (name === "전체" ? (scope ? sTabs(scope).some((c) => v.cats.includes(c)) : !v.embed && !v.cats.includes("Lyrics") && !v.cats.includes("PHOTO")) : v.cats.includes(name)) &&
      (!memberFilter.length || (memberFilter.length === 1 && memberFilter[0] === "리즈"
        ? (v.members || []).length === 1 && v.members[0] === "리즈"
        : (v.members || []).some((m) => memberFilter.includes(m)))) &&
      v.title.toLowerCase().includes(query.toLowerCase()));
    items.sort((a, b) => sort === "views" ? (b.views || 0) - (a.views || 0) : sort === "oldest" ? new Date(a.date) - new Date(b.date) : new Date(b.date) - new Date(a.date));
    items = pinnedFirst(pinFirst(items));

    if (albumScope) {
      const albumItems = items.filter((v) => v.album === albumScope);
      $("count").textContent = `${albumScope} · ${albumItems.length}개`;
      $("grid").classList.remove("social-list");
      const albumCard = (v) => card(v);
      $("grid").innerHTML = `<button class="back" id="albumBack" style="grid-column:1/-1">← ${label} 전체로</button>` + albumItems.map(albumCard).join("");
      $("albumBack").onclick = () => { albumScope = null; renderList(); };
      processEmbeds();
      return;
    }

    $("count").textContent = `${label} · ${items.length}개`;
    $("grid").classList.remove("social-list");
    const cardForList = (v) => card(v);
    if (name === "전체") {
      // 그룹 전체 탭에서는 폴더로 묶지 않고 전부 풀어서 정렬된 채로 보여줌
      $("grid").innerHTML = items.map(cardForList).join("");
    } else {
      const withoutAlbum = items.filter((v) => !v.album);
      $("grid").innerHTML = `<div style="grid-column:1/-1">${renderAlbumSections(items)}</div>` + withoutAlbum.map(cardForList).join("");
    }
    processEmbeds();
  }

  function renderTabs() {
    $("tabs").innerHTML = tabList().map((t, i) => `<button class="tab ${i === tab ? "on" : ""}" data-i="${i}">${TAB_LABELS[t] || t}</button>`).join("");
  }

  function route() {
    const isList = location.hash === "#list";
    $("home").hidden = isList; $("list").hidden = !isList; $("pinbar").hidden = isList;
    if (isList) {
      renderTabs();
      const showMem = !(scope && scope.hideMembers);
      $("memf").hidden = !showMem;
      if (showMem) renderMemberFilter(); else memberFilter = [];
      renderList();
    }
    window.scrollTo(0, 0);
  }

  $("back").onclick = () => { albumScope = null; location.hash = ""; };
  window.onhashchange = route;
  $("tabs").onclick = (e) => { if (e.target.dataset.i) { tab = +e.target.dataset.i; albumScope = null; renderTabs(); renderList(); } };
  $("search").oninput = (e) => { query = e.target.value; renderList(); };
  $("memf").onclick = (e) => {
    if (!e.target.dataset.m) return;
    const m = e.target.dataset.m;
    memberFilter = memberFilter.includes(m) ? memberFilter.filter((x) => x !== m) : [...memberFilter, m];
    renderMemberFilter(); renderList();
  };
  document.querySelector(".sort").onclick = (e) => {
    if (!e.target.dataset.s) return;
    sort = e.target.dataset.s;
    document.querySelectorAll(".sort button").forEach((b) => b.classList.toggle("on", b === e.target));
    renderList();
  };
  document.addEventListener("click", (e) => {
    const pb = e.target.closest && e.target.closest(".pinbtn");
    if (!pb) return;
    e.preventDefault(); e.stopPropagation();
    const k = pb.dataset.pin;
    if (pinnedSet.has(k)) { pinnedSet.delete(k); showToast("고정을 풀었어요"); } else { pinnedSet.add(k); showToast("🍊 목록 맨 위에 고정했어요"); }
    savePins();
    const y = window.scrollY;
    if (location.hash === "#list") renderList(); else renderHome();
    window.scrollTo(0, y);
  }, true);
  document.addEventListener("click", (e) => {
    const arrowBtn = e.target.closest("[data-d]");
    if (arrowBtn) arrowBtn.parentElement.querySelector(".slider").scrollBy({ left: +arrowBtn.dataset.d * 300, behavior: "smooth" });
    const jumpBtn = e.target.closest("[data-jump]");
    if (jumpBtn) { const el = document.getElementById("sec-" + jumpBtn.dataset.jump); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
    const albumBtn = e.target.closest("[data-album]");
    if (albumBtn) { albumScope = albumBtn.dataset.album; renderList(); window.scrollTo(0, 0); }
    const secBtn = e.target.closest("[data-sec], [data-all]");
    if (secBtn) {
      albumScope = null;
      scope = secBtn.dataset.sec !== undefined ? HOME_SECTIONS[+secBtn.dataset.sec] : null;
      tab = 0; query = ""; memberFilter = []; $("search").value = "";
      if (scope && scope.openTab) { const idx = tabList().indexOf(scope.openTab); if (idx > -1) tab = idx; }
      location.hash = "list";
    }
  });


  // ---- 사진 모아보기 (게시물 카드를 누르면 사진이 세로로 쭉 보임) ----
  let pvEl;
  function openPv(key) {
    const v = videos.find((x) => x.photos && pinKey(x) === key);
    if (!v || !v.photos) return;
    if (!pvEl) {
      pvEl = document.createElement("div"); pvEl.className = "pv"; pvEl.hidden = true;
      document.body.appendChild(pvEl);
      pvEl.addEventListener("click", (e) => { if (e.target.closest(".pv-x")) closePv(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !pvEl.hidden) closePv(); });
    }
    const mem = (v.members || []).join(", ");
    pvEl.innerHTML = `<div class="pv-bar"><button class="pv-x" aria-label="닫기">×</button>
      <div class="pv-h"><div class="pv-t">${esc(v.title)}</div><div class="pv-m">${fmtDate(v.date)}${mem ? " · " + esc(mem) : ""} · ${v.photos.length}장${v.url ? ` <a href="${esc(v.url)}" target="_blank" rel="noopener">원문 보기</a>` : ""}</div></div></div>
      <div class="pv-body${v.cols === 2 ? " pv2" : ""}">${v.photos.map((u) => `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" />`).join("")}<div class="pv-end">· 끝 ·</div></div>`;
    pvEl.scrollTop = 0; pvEl.hidden = false; document.body.style.overflow = "hidden";
  }
  function closePv() { pvEl.hidden = true; document.body.style.overflow = ""; }
  document.addEventListener("click", (e) => {
    const c = e.target.closest && e.target.closest(".card.photo-card");
    if (!c || e.target.closest(".pinbtn")) return;
    e.preventDefault(); openPv(c.dataset.pk);
  });

  async function load() {
    const ALL_IDS = [...new Set([...OTHER_IDS.map(extractId), ...Object.values(CATEGORIES).flatMap((c) => c.parsed.map((p) => p.id))])];
    if (!ALL_IDS.length) { $("status").textContent = "영상 ID를 추가해주세요."; return; }
    try {
      const chunks = [];
      for (let i = 0; i < ALL_IDS.length; i += 50) chunks.push(ALL_IDS.slice(i, i + 50).join(","));
      const results = await Promise.all(chunks.map((ids) =>
        fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${API_KEY}`).then((r) => r.json())));
      for (const data of results) {
        if (data.error) { $("status").textContent = "오류: " + data.error.message; return; }
        data.items.forEach((v) => {
          const sec = toSec(v.contentDetails.duration);
          const title = v.snippet.title;
          videos.push({
            id: v.id, title, date: INLINE_DATE[v.id] || v.snippet.publishedAt,
            thumb: (v.snippet.thumbnails.maxres || v.snippet.thumbnails.standard || v.snippet.thumbnails.high || v.snippet.thumbnails.medium).url,
            views: +v.statistics.viewCount || 0, sec, isShort: sec <= 60,
            members: INLINE_MEMBERS[v.id] || MEMBERS_OF[v.id] || [],
            lyricsType: INLINE_LYRICS[v.id] || LYRICS_TYPE_OF[v.id] || "",
            album: INLINE_ALBUM[v.id] || ALBUM_OF[v.id] || null,
            platform: INLINE_PLATFORM[v.id] || null,
            cats: Object.keys(CATEGORIES).filter((k) => !((CATEGORIES[k].exclude || []).includes(v.id)) && (CATEGORIES[k].parsed.some((p) => p.id === v.id) ||
              (CATEGORIES[k].keyword && title.toUpperCase().includes(CATEGORIES[k].keyword.toUpperCase())))),
          });
        });
      }
      MANUAL_ITEMS.map(parseManual).forEach((m, i) => {
        const isPhoto = (m.cats || []).includes("PHOTO") || !!m.photos;
        const photos = m.photos ? m.photos.split(";").map((x) => x.trim()).filter(Boolean) : null;
        videos.push({
          id: "manual" + i, url: m.url, title: m.title, date: m.date, thumb: m.thumb || (photos ? photos[0] : ""), photos,
          views: null, sec: 0, isShort: false, cats: m.cats || [], platform: m.platform || guessPlatform(m.url),
          members: m.members || [], lyricsType: "", album: m.album || null, ratio: m.ratio, cols: m.cols,
          embed: isPhoto ? null : /twitter\.com|x\.com/.test(m.url || "") ? "twitter" : /instagram\.com/.test(m.url || "") ? "instagram" : null,
        });
      });
      videos.forEach((v) => {
        if (v.cats.some((c) => ["COVER", "LIVE", "L(IVE)", ...SCHEDULE_CATS].includes(c)) && !v.members.includes("아이브") && !v.members.includes("리즈")) v.members = [...v.members, "리즈"];
      });
      // MC: 특정 업로드일 영상의 멤버 지정 (한국 시간 기준 날짜)
      const MC_MEMBERS_BY_DATE = { "2024-05-14": ["레이", "리즈"], "2025-03-16": ["가을", "리즈"] };
      videos.forEach((v) => {
        if (!v.cats.includes("MC") || !v.date) return;
        const kst = new Date(new Date(v.date).getTime() + 9 * 3600 * 1000).toISOString().slice(0, 10);
        if (MC_MEMBERS_BY_DATE[kst]) v.members = [...MC_MEMBERS_BY_DATE[kst]];
      });
      videos.forEach((v) => { if (v.cats.includes("LIVE") || v.cats.includes("L(IVE)")) v.platform = v.platform || PLATFORM_OF[v.id] || "YouTube"; });
      // Platform 카테고리: 플랫폼 딱지에 따라 자동 분류 (기존 카테고리에서도 그대로 보임)
      videos.forEach((v) => {
        if (v.platform === "Berriz" && !v.cats.includes("Berriz")) v.cats.push("Berriz");
        if (v.platform === "Daum Cafe" && !v.cats.includes("DAUM CAFE")) v.cats.push("DAUM CAFE");
      });
      $("status").remove();
      renderHome(); route();
    } catch (err) {
      $("status").textContent = "네트워크 오류: " + err.message;
    }
  }
  load();
</script>
