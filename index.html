      :root {
        --bg: #fffaf1;
        --panel: #fbeed8;
        --line: #f0dcbc;
        --text: #4b3521;
        --muted: #a58d72;
        --red: #f08a2c;
        --gold: #e08a00;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Tuktak", -apple-system, "Pretendard", "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
      }
      input,
      textarea,
      select {
        font-family: inherit;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .wrap {
        position: relative;
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px 48px;
      }
      .logo {
        padding: 36px 0 20px;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .logo span {
        color: var(--red);
      }
      .gb-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--red);
        background: #fff1e0;
        border: 1.3px solid var(--red);
      }
      .gb-btn svg {
        width: 13px;
        height: 13px;
      }
      .gb {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(60, 45, 30, 0.34);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .gb-box {
        width: 100%;
        max-width: 320px;
        max-height: 68vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px 14px;
        box-shadow: 0 8px 28px rgba(75, 53, 33, 0.16);
      }
      .gb-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--red);
      }
      .gb-head button {
        font-size: 20px;
        line-height: 1;
        color: var(--red);
      }
      .gb-box input,
      .gb-box textarea {
        width: 100%;
        margin-bottom: 6px;
        padding: 7px 10px;

            ? `<a class="bz-go" href="${esc(
                v.url
              )}" target="_blank" rel="noopener" aria-label="Berriz 원문" title="Berriz 원문"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg></a>`
            : ""
        }</div></div>
      <div class="bz-text">${text}</div>${
          imgs.length
            ? `<div class="bz-imgs n${imgs.length > 1 ? 2 : 1}">${imgs
                .map(
                  (u) =>
                    `<img src="${esc(
                      u
                    )}" alt="" loading="lazy" referrerpolicy="no-referrer" />`
                )
                .join("")}</div>`
            : ""
        }${cms}</div>`;
      }
      function openBerriz(v) {
        if (!bzEl) {
          bzEl = document.createElement("div");
          bzEl.className = "pv bz";
          bzEl.hidden = true;
          document.body.appendChild(bzEl);
          bzEl.addEventListener("click", (e) => {
            if (e.target.closest(".pv-x")) closeBz();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !bzEl.hidden) closeBz();
          });
        }
        bzEl.innerHTML = `<div class="pv-bar"><button class="pv-x" aria-label="닫기">×</button>
      <div class="pv-h"><div class="pv-m">Berriz${
        v.board ? " · " + esc(v.board) : ""
      }${
          v.url
            ? ` <a href="${esc(
                v.url
              )}" target="_blank" rel="noopener">원문 보기</a>`
            : ""
        }</div></div></div>${bzPost(v)}`;
        bzEl.scrollTop = 0;
        bzEl.hidden = false;
        document.body.style.overflow = "hidden";
      }
      let cafeEl;
      function cafeComments(v) {
        if (!v.comments) return "";
        const rows = v.comments.split("§").map((c) => {
          const [a, t, u] = c.split("¦");
          return `<div class="cafe-cm"><b>IVE ${esc(cafeName(a || ""))}</b>${
            t ? `<div class="cafe-cm-t">${esc(t)}</div>` : ""
          }${
            u
              ? `<img src="${esc(
                  u
                )}" alt="" loading="lazy" referrerpolicy="no-referrer" />`
              : ""
          }</div>`;
        });
        return `<div class="cafe-cms"><div class="cafe-cms-h">댓글 ${
          rows.length
        }</div><div class="cafe-cm-box">${rows.join("")}</div></div>`;
      }
      function openCafe(key) {
        const v = videos.find((x) => x.content && pinKey(x) === key);
        if (!v) return;
        if ((v.cats || []).includes("Berriz")) return openBerriz(v);
        if (!cafeEl) {
          cafeEl = document.createElement("div");
          cafeEl.className = "pv";
          cafeEl.hidden = true;
          document.body.appendChild(cafeEl);
          cafeEl.addEventListener("click", (e) => {
            if (e.target.closest(".pv-x")) closeCafe();
          });
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !cafeEl.hidden) closeCafe();
          });
        }
        const mem = (v.members || []).length
          ? " " + v.members.map(cafeName).join(", ")
          : "";
        cafeEl.innerHTML = `<div class="pv-bar"><button class="pv-x" aria-label="닫기">×</button>
      <div class="pv-h"><div class="pv-t">${esc(
        v.title
      )}</div><div class="pv-m">${v.board ? esc(v.board) + " · " : ""}IVE${esc(
          mem
        )} · ${fmtDate(v.date)}${
          v.views != null ? " · 조회 " + v.views.toLocaleString() : ""
        }${
          v.url
            ? ` <a href="${esc(
                v.url
              )}" target="_blank" rel="noopener">원문 보기</a>`
            : ""
        }</div></div></div>
      <div class="pv-body">${
        v.image
          ? `<img class="cafe-img" src="${esc(
              v.image
            )}" alt="" loading="lazy" referrerpolicy="no-referrer" />`
          : ""
      }<div class="cafe-post">${esc(v.content)}</div>${cafeComments(v)}</div>`;
        cafeEl.scrollTop = 0;
        cafeEl.hidden = false;
        document.body.style.overflow = "hidden";
      }
      function closeCafe() {
        cafeEl.hidden = true;
        document.body.style.overflow = "";
      }
      document.addEventListener("click", (e) => {
        const c = e.target.closest && e.target.closest("[data-ck]");
        if (!c || e.target.closest(".pinbtn")) return;
        e.preventDefault();
        openCafe(c.dataset.ck);
      });
      async function load() {
        const ALL_IDS = [
          ...new Set([
            ...OTHER_IDS.map(extractId),
            ...Object.values(CATEGORIES).flatMap((c) =>
              c.parsed.map((p) => p.id)
            ),
          ]),
        ];
        if (!ALL_IDS.length) {
          $("status").textContent = "영상 ID를 추가해주세요.";
          return;
        }
        try {
          const chunks = [];
          for (let i = 0; i < ALL_IDS.length; i += 50)
            chunks.push(ALL_IDS.slice(i, i + 50).join(","));
          const results = await Promise.all(
            chunks.map((ids) =>
              fetch(
                `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${ids}&key=${API_KEY}`
              ).then((r) => r.json())
            )
          );
          for (const data of results) {
            if (data.error) {
              $("status").textContent = "오류: " + data.error.message;
              return;
            }
            data.items.forEach((v) => {
              const sec = toSec(v.contentDetails.duration);
              const title = INLINE_TITLE[v.id] || v.snippet.title;
              videos.push({
                id: v.id,
                title,
                date: INLINE_DATE[v.id] || v.snippet.publishedAt,
                thumb: (
                  v.snippet.thumbnails.maxres ||
                  v.snippet.thumbnails.standard ||
                  v.snippet.thumbnails.high ||
                  v.snippet.thumbnails.medium
                ).url,
                views: +v.statistics.viewCount || 0,
                sec,
                isShort: sec <= 60,
                members: INLINE_MEMBERS[v.id] || MEMBERS_OF[v.id] || [],
                lyricsType: INLINE_LYRICS[v.id] || LYRICS_TYPE_OF[v.id] || "",
                album: INLINE_ALBUM[v.id] || ALBUM_OF[v.id] || null,
                platform: INLINE_PLATFORM[v.id] || null,
                cats: Object.keys(CATEGORIES).filter(
                  (k) =>
                    !(CATEGORIES[k].exclude || []).includes(v.id) &&
                    (CATEGORIES[k].parsed.some((p) => p.id === v.id) ||
                      (CATEGORIES[k].keyword &&
                        title
                          .toUpperCase()
                          .includes(CATEGORIES[k].keyword.toUpperCase())))
                ),
              });
            });
          }
          MANUAL_ITEMS.map(parseManual).forEach((m, i) => {
            const isPhoto = (m.cats || []).includes("PHOTO") || !!m.photos;
            // photos=...;---;... 처럼 '---' 를 넣으면 그 자리에 구분선(행 나눔)이 들어갑니다.
            const breaks = [];
            const photos = m.photos
              ? m.photos
                  .split(";")
                  .map((x) => x.trim())
                  .filter(Boolean)
                  .reduce((arr, x) => {
                    if (x === "---") breaks.push(arr.length);
                    else arr.push(x);
                    return arr;
                  }, [])
              : null;
            videos.push({
              id: "manual" + i,
              url: m.url,
              title: m.title,
              date: m.date,
              dateStart: m.dateStart,
              captions: m.captions
                ? m.captions.split(";").map((x) => x.trim())
                : null,
              thumb: m.thumb || (photos ? photos[0] : ""),
              photos,
              breaks,
              content: m.content || null,
              board: m.board || null,
              image: m.image || null,
              comments: m.comments || null,
              images: m.imgs
                ? m.imgs
                    .split(";")
                    .map((x) => x.trim())
                    .filter(Boolean)
                : null,
              views: m.views != null ? m.views : null,
              sec: 0,
              isShort: false,
              cats: m.cats || [],
              platform: (m.cats || []).includes("DAUM CAFE")
                ? null
                : m.platform || guessPlatform(m.url),
              members: m.members || [],
              lyricsType: "",
              album: m.album || null,
              ratio: m.ratio,
              cols: m.cols,
              bare: m.bare,
              original: m.original,
              embed: isPhoto
                ? null
                : /twitter\.com|x\.com/.test(m.url || "")
                ? "twitter"
                : /instagram\.com/.test(m.url || "")
                ? "instagram"
                : /tiktok\.com/.test(m.url || "")
                ? "tiktok"
                : null,
            });
          });
          videos.forEach((v) => {
            if (
              v.cats.some((c) =>
                ["COVER", "LIVE", "L(IVE)", ...SCHEDULE_CATS].includes(c)
              ) &&
              !v.members.includes("아이브") &&
              !v.members.includes("리즈")
            )
              v.members = [...v.members, "리즈"];
          });
          videos.forEach((v) => {
            if ((v.cats || []).includes("Instagram") && !v.board)
              v.board = "liz.yeyo"; // ivestarship 계정이 아닌 인스타 게시물 = liz.yeyo
          });
          videos.forEach((v) => {
            if ((v.cats || []).includes("Twitter"))
              v.board = (v.url || "").includes("IVEstarship_JP/status/")
                ? "IVEstarship_JP"
                : "IVE_twt";
          });
          // MC: 특정 업로드일 영상의 멤버 지정 (한국 시간 기준 날짜)
          const MC_MEMBERS_BY_DATE = {
            "2024-05-14": ["레이", "리즈"],
            "2025-03-16": ["가을", "리즈"],
          };
          videos.forEach((v) => {
            if (!v.cats.includes("MC") || !v.date) return;
            const kst = new Date(new Date(v.date).getTime() + 9 * 3600 * 1000)
              .toISOString()
              .slice(0, 10);
            if (MC_MEMBERS_BY_DATE[kst])
              v.members = [...MC_MEMBERS_BY_DATE[kst]];
          });
          videos.forEach((v) => {
            if (v.cats.includes("LIVE") || v.cats.includes("L(IVE)"))
              v.platform = v.platform || PLATFORM_OF[v.id] || "YouTube";
            if (v.platform === "none") v.platform = null; // platform=none → 딱지 없음
          });
          // 같은 영상을 COVER에서만 다른 제목으로 보여주기: { 영상ID: ["카테고리", "제목"] }
          const CAT_TITLE = {
            gMXtrfR9gsY: [
              "COVER",
              "성시경의 부를텐데 l 너의 모든 순간, 행복한 나를",
            ],
          };
          Object.keys(CAT_TITLE).forEach((id) => {
            const v = videos.find((x) => x.id === id);
            if (!v) return;
            const [cat, title] = CAT_TITLE[id];
            if (v.cats.includes(cat)) {
              videos.push({
                ...v,
                id: id + "~" + cat,
                url: "https://youtu.be/" + id,
                title,
                cats: [cat],
              });
              v.cats = v.cats.filter((c) => c !== cat);
            }
          });
          $("status").remove();
          renderHome();
          renderBell();
          route();
        } catch (err) {
          $("status").textContent = "네트워크 오류: " + err.message;
        }
      }
      // ---- GUESTBOOK ----
      // 연결 주소(GUESTBOOK_URL)는 파일 위쪽 API_KEY 바로 아래에 있습니다.
      const GB_KEY = "guestbookLocal",
        GB_OWN = "guestbookOwn";
      let gbEl,
        gbEditing = null;
      const gbRand = () => Math.random().toString(36).slice(2, 10);
      const gbOwn = () => {
        try {
          return JSON.parse(localStorage.getItem(GB_OWN) || "{}");
        } catch (e) {
          return {};
        }
      };
      const gbSetOwn = (o) => {
        try {
          localStorage.setItem(GB_OWN, JSON.stringify(o));
        } catch (e) {}
      };
      const gbLocalWrite = (list) => {
        try {
          localStorage.setItem(GB_KEY, JSON.stringify(list.slice(0, 200)));
        } catch (e) {}
      };
      async function gbLoad() {
        if (GUESTBOOK_URL) {
          try {
            return await (await fetch(GUESTBOOK_URL)).json();
          } catch (e) {
            return [];
          }
        }
        try {
          return JSON.parse(localStorage.getItem(GB_KEY) || "[]");
        } catch (e) {
          return [];
        }
      }
      async function gbPost(body) {
        try {
          await fetch(GUESTBOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(body),
          });
        } catch (e) {}
      }
      async function gbAdd(name, text) {
        const id = Date.now().toString(36) + gbRand(),
          key = gbRand() + gbRand(),
          date = fmtDate(new Date().toISOString());
        const own = gbOwn();
        own[id] = key;
        gbSetOwn(own);
        if (GUESTBOOK_URL)
          return gbPost({ action: "add", id, key, name, text, date });
        const list = await gbLoad();
        list.unshift({ id, name, text, date });
        gbLocalWrite(list);
      }
      async function gbEdit(id, name, text) {
        if (GUESTBOOK_URL)
          return gbPost({ action: "edit", id, key: gbOwn()[id], name, text });
        gbLocalWrite(
          (await gbLoad()).map((g) => (g.id === id ? { ...g, name, text } : g))
        );
      }
      async function gbDel(id) {
        if (GUESTBOOK_URL)
          await gbPost({ action: "delete", id, key: gbOwn()[id] });
        else gbLocalWrite((await gbLoad()).filter((g) => g.id !== id));
        const own = gbOwn();
        delete own[id];
        gbSetOwn(own);
      }
      async function gbRender() {
        const list = await gbLoad();
        gbEl._list = list;
        const own = gbOwn();
        gbEl.querySelector(".gb-list").innerHTML = list.length
          ? list
              .map(
                (g) =>
                  `<div class="gb-item"><div class="gb-top"><b>${esc(
                    String(g.name || "익명")
                  )}</b><i>${esc(String(g.date || ""))}</i>${
                    own[g.id]
                      ? `<span class="gb-act"><button data-gbedit="${esc(
                          String(g.id)
                        )}">수정</button><button data-gbdel="${esc(
                          String(g.id)
                        )}">삭제</button></span>`
                      : ""
                  }</div><div class="gb-text">${esc(
                    String(g.text || "")
                  )}</div></div>`
              )
              .join("")
          : '<div class="gb-item" style="color:var(--muted)">아직 작성된 글이 없어요 🍊</div>';
      }
      function gbReset() {
        gbEditing = null;
        gbEl.querySelector("#gbText").value = "";
        gbEl.querySelector("#gbSend").textContent = "남기기";
        gbEl.querySelector("#gbCancel").hidden = true;
      }
      function gbClose() {
        gbEl.hidden = true;
        document.body.style.overflow = "";
      }
      function openGb() {
        if (!gbEl) {
          gbEl = document.createElement("div");
          gbEl.className = "gb";
          gbEl.hidden = true;
          gbEl.innerHTML = `<div class="gb-box">
            <div class="gb-head"><span>💌 GUESTBOOK</span><button aria-label="닫기" data-gbx>×</button></div>
            <input id="gbName" maxlength="20" placeholder="닉네임" />
            <textarea id="gbText" maxlength="500" placeholder="남기고 싶은 말을 적어주세요"></textarea>
            <div class="gb-row"><button class="gb-cancel" id="gbCancel" hidden>취소</button><button class="gb-send" id="gbSend">남기기</button></div>
            <div class="gb-list"></div></div>`;
          document.body.appendChild(gbEl);
          gbEl.addEventListener("click", async (e) => {
            if (e.target === gbEl || e.target.closest("[data-gbx]"))
              return gbClose();
            const ed = e.target.closest("[data-gbedit]");
            if (ed) {
              const g = (gbEl._list || []).find(
                (x) => String(x.id) === ed.dataset.gbedit
              );
              if (!g) return;
              gbEditing = String(g.id);
              gbEl.querySelector("#gbName").value = g.name || "";
              gbEl.querySelector("#gbText").value = g.text || "";
              gbEl.querySelector("#gbSend").textContent = "수정 완료";
              gbEl.querySelector("#gbCancel").hidden = false;
              gbEl.querySelector("#gbText").focus();
              return;
            }
            const dl = e.target.closest("[data-gbdel]");
            if (dl) {
              if (!confirm("이 글을 삭제할까요?")) return;
              await gbDel(dl.dataset.gbdel);
              if (gbEditing === dl.dataset.gbdel) gbReset();
              showToast("삭제했어요");
              gbRender();
            }
          });
          gbEl.querySelector("#gbCancel").onclick = gbReset;
          gbEl.querySelector("#gbSend").onclick = async () => {
            const text = gbEl.querySelector("#gbText").value.trim();
            if (!text) return showToast("내용을 적어주세요");
            const name = gbEl.querySelector("#gbName").value.trim() || "익명";
            if (gbEditing) {
              await gbEdit(gbEditing, name, text);
              showToast("수정했어요");
            } else {
              await gbAdd(name, text);
              showToast("💌 남겼어요");
            }
            gbReset();
            gbRender();
          };
        }
        gbEl.hidden = false;
        document.body.style.overflow = "hidden";
        gbRender();
      }
      $("gbBtn").onclick = openGb;
      // ---- 알림종: 전체에서 가장 최근 항목 5개 ----
      const BELL_KEY = "bellSeen";
      let bellItems = [];
      function renderBell() {
        const now = Date.now();
        bellItems = videos
          .filter(
            (v) =>
              v.date &&
              !String(v.id).includes("~") &&
              new Date(v.date).getTime() <= now
          )
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .slice(0, 5);
        let seen = "";
        try {
          seen = localStorage.getItem(BELL_KEY) || "";
        } catch (e) {}
        $("bellDot").hidden =
          !bellItems.length || seen === String(bellItems[0].date);
        const lab = (v) => {
          const c = (v.cats || [])[0] || "";
          return TAB_LABELS[c] || c || "NEW";
        };
        $("bellPop").innerHTML =
          '<div class="bell-h">🔔 NEW</div>' +
          (bellItems.length
            ? bellItems
                .map(
                  (v, i) =>
                    `<button class="bell-it" data-bk="${i}"><b>${esc(
                      lab(v)
                    )}</b>${esc(v.title || "")}<i>${fmtDate(
                      v.date
                    )}</i></button>`
                )
                .join("")
            : '<div class="bell-it" style="color:var(--muted)">아직 새 소식이 없어요</div>');
      }
      $("bellBtn").onclick = (e) => {
        e.stopPropagation();
        const pop = $("bellPop");
        pop.hidden = !pop.hidden;
        if (!pop.hidden && bellItems.length) {
          try {
            localStorage.setItem(BELL_KEY, String(bellItems[0].date));
          } catch (er) {}
          $("bellDot").hidden = true;
        }
      };
      $("bellPop").onclick = (e) => {
        e.stopPropagation();
        const b = e.target.closest("[data-bk]");
        if (!b) return;
        const v = bellItems[+b.dataset.bk];
        $("bellPop").hidden = true;
        if (v.photos && v.photos.length) openPv(pinKey(v));
        else if (v.content) openCafe(pinKey(v));
        else
          window.open(
            v.url || "https://youtu.be/" + String(v.id).split("~")[0],
            "_blank",
            "noopener"
          );
      };
      document.addEventListener("click", () => {
        $("bellPop").hidden = true;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && gbEl && !gbEl.hidden) gbClose();
      });
      renderPinBar();
      load();
    </script>
    <!-- 트위터/인스타그램 게시물을 실제 임베드로 보여주기 위한 공식 위젯 스크립트 -->
    <script
      async
      src="https://platform.twitter.com/widgets.js"
      charset="utf-8"
    ></script>
    <script async src="https://www.instagram.com/embed.js"></script>
  </body>
</html>
